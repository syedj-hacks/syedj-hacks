<svg width="1200" height="480" viewBox="0 0 1200 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Syed Jafar - Junior Penetration Tester terminal banner">
  <title>whoami --offsec</title>
  <defs>
    <clipPath id="panelClip">
      <rect x="24" y="24" width="1152" height="432" rx="14"/>
    </clipPath>
    <clipPath id="infoBoxClip">
      <rect x="704" y="88" width="448" height="300" rx="10"/>
    </clipPath>
    <clipPath id="typeClip1">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" begin="0.3s" dur="2.4s" fill="freeze"
          calcMode="discrete"
          keyTimes="0;0.067;0.133;0.2;0.267;0.333;0.4;0.467;0.533;0.6;0.667;0.733;0.8;0.867;0.933;1"
          values="0;18;36;54;72;90;108;126;144;162;180;198;216;234;252;270"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="480" fill="#080B10"/>

  <rect x="24" y="24" width="1152" height="432" rx="14" fill="#0F141C" stroke="#1E2836" stroke-width="1"/>
  <g clip-path="url(#panelClip)">
    <rect x="24" y="24" width="1152" height="3" fill="#1B5B92"/>
    <rect x="24" y="27" width="1152" height="41" fill="#131A24"/>
    <circle cx="52" cy="47" r="6" fill="#FF5F56"/>
    <circle cx="74" cy="47" r="6" fill="#FFBD2E"/>
    <circle cx="96" cy="47" r="6" fill="#27C93F"/>
    <text x="600" y="52" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#77879B">whoami --offsec</text>
  </g>

  <line x1="680" y1="88" x2="680" y2="436" stroke="#1E2836" stroke-width="1"/>

  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">
    <text x="56" y="100" font-size="12">
      <tspan fill="#4E5C6E">syedj-hacks@offsec:~$ </tspan><tspan fill="#2F9BF5" font-weight="bold">act 1</tspan><tspan fill="#4E5C6E"> &#8212; recon</tspan>
    </text>

    <text x="56" y="140" font-size="15">
      <tspan fill="#2F9BF5">guest@syedj-hacks</tspan><tspan fill="#77879B">:~$ </tspan><tspan fill="#DDE5EF">whoami --offsec</tspan>
    </text>

    <text x="56" y="176" font-size="15">
      <tspan fill="#2F9BF5">&gt; </tspan><tspan fill="#DDE5EF" clip-path="url(#typeClip1)" x="72">initializing recon module...</tspan>
    </text>
    <rect x="342" y="164" width="8" height="16" fill="#2F9BF5" opacity="0">
      <animate attributeName="opacity" begin="2.7s" dur="1.2s" keyTimes="0;0.001;0.5;1" values="1;1;0;0" repeatCount="indefinite" fill="freeze"/>
    </rect>

    <text x="56" y="212" font-size="13" fill="#77879B" opacity="0">
      &gt; loading toolkit: nmap &#183; burpsuite &#183; metasploit
      <animate attributeName="opacity" begin="2.8s" dur="0.4s" values="0;1" fill="freeze"/>
    </text>

    <text x="56" y="246" font-size="13" fill="#DDE5EF" opacity="0">
      &gt; status: recon phase complete
      <animate attributeName="opacity" begin="3.2s" dur="0.4s" values="0;1" fill="freeze"/>
    </text>

    <rect x="704" y="88" width="448" height="300" rx="10" fill="#131A24" stroke="#1E2836" stroke-width="1"/>
    <g clip-path="url(#infoBoxClip)">
      <rect x="704" y="88" width="448" height="3" fill="#1B5B92"/>
    </g>

    <text x="724" y="124" font-size="14" letter-spacing="2" fill="#2F9BF5" font-weight="bold">SYSTEM.INFO</text>

    <rect x="1042" y="104" width="90" height="26" rx="13" fill="#2F9BF5" fill-opacity="0.12" stroke="#2F9BF5" stroke-width="1"/>
    <circle cx="1059" cy="117" r="4" fill="#2F9BF5">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="1072" y="121" font-size="11" letter-spacing="1" fill="#2F9BF5">ACTIVE</text>

    <!-- ROLE -->
    <text x="724" y="176" font-size="13" fill="#77879B" textLength="90" lengthAdjust="spacingAndGlyphs">ROLE</text>
    <text x="814" y="176" font-size="13" fill="#4E5C6E" textLength="115" lengthAdjust="spacingAndGlyphs">.....................</text>
    <text x="929" y="176" text-anchor="start" font-size="13" fill="#DDE5EF">Junior Penetration Tester</text>

    <!-- FOCUS -->
    <text x="724" y="216" font-size="13" fill="#77879B" textLength="90" lengthAdjust="spacingAndGlyphs">FOCUS</text>
    <text x="814" y="216" font-size="13" fill="#4E5C6E" textLength="193" lengthAdjust="spacingAndGlyphs">.......................................</text>
    <text x="1007" y="216" text-anchor="start" font-size="13" fill="#DDE5EF">AppSec &amp; AD Enum</text>

    <!-- STATUS -->
    <text x="724" y="256" font-size="13" fill="#77879B" textLength="90" lengthAdjust="spacingAndGlyphs">STATUS</text>
    <text x="814" y="256" font-size="13" fill="#4E5C6E" textLength="240" lengthAdjust="spacingAndGlyphs">.....................................</text>
    <text x="1054" y="256" text-anchor="start" font-size="13" fill="#DDE5EF">OSCP-track</text>

    <!-- LOCATION -->
    <text x="724" y="296" font-size="13" fill="#77879B" textLength="90" lengthAdjust="spacingAndGlyphs">LOCATION</text>
    <text x="814" y="296" font-size="13" fill="#4E5C6E" textLength="232" lengthAdjust="spacingAndGlyphs">....................................</text>
    <text x="1046" y="296" text-anchor="start" font-size="13" fill="#DDE5EF">Karachi, PK</text>

    <text x="724" y="336" font-size="12" fill="#77879B">TryHackMe: 63 labs &#183; top 9% &#183; 82-day streak</text>
    <text x="724" y="358" font-size="12" fill="#77879B">github.com/syedj-hacks</text>
  </g>

  <image href="data:image/png;base64," x="1080" y="396" width="72" height="54" opacity="0.92" preserveAspectRatio="xMidYMid meet"/>
</svg>
