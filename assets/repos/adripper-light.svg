<svg width="580" height="210" viewBox="0 0 580 210" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ADripper repo card">
  <defs>
    <clipPath id="adripperCardClipLight">
      <rect x="1" y="1" width="578" height="208" rx="14"/>
    </clipPath>
  </defs>
  <rect x="1" y="1" width="578" height="208" rx="14" fill="#FFFFFF" stroke="#CBD5E2" stroke-width="1"/>
  <g clip-path="url(#adripperCardClipLight)">
    <rect x="1" y="1" width="578" height="3" fill="#8FB6E6"/>
  </g>
  <g opacity="0" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">
    <animate attributeName="opacity" begin="0.3s" dur="0.6s" values="0;1" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" begin="0.3s" dur="0.6s" values="0,14;0,0" fill="freeze"/>

    <text x="22" y="34" font-size="11" letter-spacing="2" fill="#1466C6">PYTHON &#183; AD ENUM CLI</text>
    <text x="22" y="64" font-size="20" font-weight="bold" fill="#0D1826">ADripper</text>

    <text x="22" y="94" font-size="13.5" fill="#0D1826">Authorized AD recon &#8212; Kerberoast, delegation abuse,</text>
    <text x="22" y="116" font-size="13.5" fill="#0D1826">dangerous ACLs, and a BloodHound-style path to DA.</text>

    <line x1="22" y1="138" x2="558" y2="138" stroke="#E1E7F0" stroke-width="1"/>

    <text x="22" y="160" font-size="10.5" letter-spacing="1.5" fill="#1466C6" font-weight="bold">HIGHLIGHTS</text>
    <text x="22" y="180" font-size="12" fill="#526074">51 unit tests &#183; risk-scored reports &#183; dry-run safety gate</text>

    <text x="558" y="196" text-anchor="end" font-size="12" fill="#1466C6">view repo &#8599;</text>
  </g>
</svg>
