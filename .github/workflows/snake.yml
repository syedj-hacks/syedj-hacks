name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: syedj-hacks
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%232F9BF5&color_dots=%23CBD5E2,%23A9C6EC,%2385AEE0,%234D8ED4,%232F9BF5
            dist/github-contribution-grid-snake-dark.svg?color_snake=%232F9BF5&color_dots=%231E2836,%23223349,%232A4566,%23225C93,%232F9BF5

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
